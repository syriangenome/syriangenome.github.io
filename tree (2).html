<style id="st">
/* Layout: dark lab-notebook page; tree on one side, branch "specimen card" on the other; each major haplogroup keeps one colour everywhere */

*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 16px}

.tog{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line2);background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-family:var(--latin);font-size:.85rem;line-height:1;padding:0}

.card{background:var(--panel);border:1.5px solid var(--c,var(--line2));border-radius:18px;padding:16px;position:sticky;top:12px}
.card .crumbs{display:flex;flex-wrap:wrap;gap:4px;direction:ltr;margin:8px 0 12px}

.card .big{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 12px}
.card .big div b{display:block;font-family:var(--latin);font-size:1.5rem;font-variant-numeric:tabular-nums}

.mini{display:flex;flex-direction:column;gap:5px;margin:6px 0 14px}
.mini .r{display:grid;grid-template-columns:92px 1fr 30px;gap:8px;align-items:center;font-size:.86rem}
.mini .r .t{height:9px;border-radius:5px;background:var(--bg2);overflow:hidden}
.mini .r .t i{display:block;height:100%;background:var(--teal);border-radius:5px}
.mini .r b{font-family:var(--latin);font-weight:500;color:var(--muted);text-align:left}
.tag{display:inline-block;font-size:.78rem;border-radius:6px;padding:0 7px;margin-inline-end:4px;border:1px solid}

.tag.str{color:var(--teal);border-color:var(--teal)}
.tag.ff{color:var(--amber);border-color:var(--amber)}

.names{color:var(--rose);font-size:.9rem}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--gold2);font-size:1.1rem;margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);margin-top:10px}
.note{margin-top:18px;color:var(--muted);font-size:.9rem;border-inline-start:3px solid var(--teal);padding-inline-start:12px;max-width:80ch}
.admin{margin-top:28px;background:var(--bg2);border:1.5px dashed var(--gold);border-radius:18px;padding:18px}
.admin h2{margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:1.3rem}}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
textarea{font-family:var(--latin);direction:ltr;min-height:84px}
.check{flex-direction:row;align-items:center;gap:8px}
.rows{margin-top:14px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;background:var(--panel);border-radius:10px;padding:8px 10px;font-size:.86rem}
.row .p{font-family:var(--latin);direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;min-width:0}
.row .acts{display:flex;gap:6px}
.mini-btn{background:none;border:1px solid var(--muted);color:var(--muted);border-radius:8px;padding:1px 9px;font-size:.8rem}
.mini-btn.del{border-color:var(--rose);color:var(--rose)}
.pending{color:var(--gold2);font-size:.9rem}

<body>

<script type="application/json" id="data">{"entries": [{"id": "mwkcabtn90ws", "path": ["J-M172", "J-M410", "J-CTS7683", "J-L26", "J-PF5088", "J-PF5160", "J-L24", "J-Z393", "J-L25", "J-Z7700", "J-Z32167", "J-Z44894", "J-Z38363", "J-Y26741", "J-Z38370"], "region": "دمشق", "test": "Family Finder", "added": "2026-11-17", "updated": "2026-11-17"}], "ages": {}}</script>
<script id="main">
(function(){
const GOVS=["دمشق","ريف دمشق","حلب","حمص","حماة","اللاذقية","طرطوس","إدلب","الرقة","دير الزور","الحسكة","درعا","السويداء","القنيطرة","غير محدد"];
const TESTS=["Big Y","YSEQ","SNP Pack","Y-111","Y-67","Y-37","Family Finder","أخرى"];
const DEPTH={"Big Y":"deep","YSEQ":"deep","SNP Pack":"deep","Y-111":"str","Y-67":"str","Y-37":"str","Family Finder":"ff","فحص جسدي":"ff"};
const DEPTH_AR={deep:"فحص تحوّرات عميق",str:"فحص ماركرات (سلالة متوقعة)",ff:"Family Finder (سلالة تقديرية)",other:"أخرى"};
const COLORS={J:"var(--gold)",E:"var(--teal)",T:"var(--rose)",G:"var(--green)",R:"var(--violet)",I:"var(--amber)"};
const colorOf=l=>COLORS[l]||"var(--muted)";
const depthOf=t=>DEPTH[t]||"other";
let DATA;
try{DATA=JSON.parse(document.getElementById('data').textContent)}catch(e){DATA={entries:[],ages:{}}}
DATA.entries=DATA.entries||[];DATA.ages=DATA.ages||{};
let draft=JSON.parse(JSON.stringify(DATA));
let dirty=false,isAdmin=false,art=null,editId=null;
const ui={q:"",gov:"",depth:"",view:"draw",sel:""};
const open=new Set();
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>s.replace(/[^A-Za-z0-9-]/g,'-');

function parsePath(txt){
  let toks=txt.split(/\s*(?:>|→|›|»|,|\n|\|)\s*/).map(s=>s.replace(/\s+/g,'')).filter(Boolean);
  const i=toks.findIndex(t=>/^[A-Za-z][0-9a-z]*-/.test(t));
  if(i>0)toks=toks.slice(i);
  let pref=null;
  return toks.map(t=>{const m=t.match(/^([A-Za-z])[0-9a-z]*-(.+)$/);
    if(m){pref=m[1].toUpperCase();return pref+'-'+m[2].toUpperCase();}
    return pref?pref+'-'+t.toUpperCase():t.toUpperCase();});
}
function filtered(){return DATA.entries.filter(e=>(!ui.gov||e.region===ui.gov)&&(!ui.depth||depthOf(e.test)===ui.depth))}
function build(entries){
  const root={name:'',kids:new Map(),total:0,direct:0,regions:{},tests:{},names:[]};
  for(const e of entries){
    if(!e.path||!e.path.length)continue;
    const letter=(e.path[0].match(/^([A-Z])-/)||[0,e.path[0][0]])[1];
    const chain=[letter,...e.path];let n=root;
    for(let k=0;k<chain.length;k++){
      const key=chain[k];
      if(!n.kids.has(key))n.kids.set(key,{name:key,top:k===0,letter,kids:new Map(),total:0,direct:0,regions:{},tests:{},names:[],parent:n});
      n=n.kids.get(key);n.total++;
      n.regions[e.region]=(n.regions[e.region]||0)+1;
      const d=depthOf(e.test);n.tests[d]=(n.tests[d]||0)+1;
    }
    n.direct++;if(e.name&&!e.hideName)n.names.push(e.name);
  }
  return root;
}
const sorted=m=>[...m.values()].sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));
function pathKey(n){const p=[];while(n&&n.name){p.unshift(n.name);n=n.parent}return p.join('>')}
function ancestry(n){const p=[];while(n&&n.name){p.unshift(n);n=n.parent}return p}
/* fold a run of single-child steps into one row */
function chainOf(n){return [n]}
function matches(n,q){if(!q)return false;const s=n.name.toUpperCase();return s.includes(q)||s.replace(/^[A-Z]-/,'').includes(q.replace(/^[A-Z]-/,''))}
function findAll(root,pred){const out=[];(function w(n){for(const c of n.kids.values()){if(pred(c))out.push(c);w(c)}})(root);return out}

function rowHTML(n){
  const chain=chainOf(n),last=chain[chain.length-1],key=pathKey(last),has=last.kids.size>0,isOpen=open.has(key);
  const hit=chain.some(c=>matches(c,ui.q));const sel=chain.some(c=>pathKey(c)===ui.sel);
  const label=chain.length>2?`${esc(chain[0].name)} <span class="skip">› ${chain.length-2} ›</span> ${esc(last.name)}`:chain.map(c=>esc(c.name)).join(' <span class="skip">›</span> ');
  const age=DATA.ages[last.name]?`<span class="age">${esc(DATA.ages[last.name])}</span>`:'';
  let h=`<li><div class="node${hit?' hit':''}${sel?' sel':''}" style="--c:${colorOf(n.letter)}" data-k="${esc(key)}" role="button" tabindex="0">`+
    `<button type="button" class="tog${has?'':' leaf'}" aria-label="${isOpen?'طيّ':'توسيع'}" aria-expanded="${isOpen}" data-t="${esc(key)}">${isOpen?'−':'+'}</button>`+
    `<span class="name${n.top?' top':''}">${label}</span><span class="count">${last.total}</span>${age}</div>`;
  if(has&&isOpen)h+=`<ul>${sorted(last.kids).map(rowHTML).join('')}</ul>`;
  return h+'</li>';
}

function svgHTML(root){
  /* top-down family-tree layout: root at the top, each opened branch drops one row */
  const rows=[];let leaves=0,maxD=0;const dx=128,dy=78;
  function lay(n,d){
    const chain=chainOf(n),last=chain[chain.length-1];maxD=Math.max(maxD,d);
    const kids=open.has(pathKey(last))?sorted(last.kids):[];const node={n,last,chain,d,kids:[]};
    if(!kids.length){node.x=leaves++*dx}else{kids.forEach(k=>node.kids.push(lay(k,d+1)));node.x=(node.kids[0].x+node.kids[node.kids.length-1].x)/2}
    rows.push(node);return node;
  }
  sorted(root.kids).forEach(k=>lay(k,0));
  const W=Math.max(leaves*dx,dx)+40,H=(maxD+1)*dy+40,ox=20+dx/2,oy=30;let s='';
  for(const r of rows){for(const k of r.kids){const x1=r.x+ox,y1=r.d*dy+oy+34,x2=k.x+ox,y2=k.d*dy+oy-16,ym=y2-10;
    s+=`<path d="M${x1} ${y1} V${ym} H${x2} V${y2}" fill="none" stroke="${colorOf(r.n.letter)}" stroke-opacity=".6" stroke-width="2"/>`}}
  for(const r of rows){const x=r.x+ox,y=r.d*dy+oy,rad=Math.min(15,8+Math.sqrt(r.last.total)*2),key=pathKey(r.last),sel=key===ui.sel,hit=matches(r.last,ui.q);
    const closed=r.last.kids.size&&!open.has(key);
    s+=`<g data-k="${esc(key)}" data-g="1" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${rad}" fill="${colorOf(r.n.letter)}" fill-opacity="${sel?1:.8}" stroke="${sel?'#f6d696':'#0a1724'}" stroke-width="${sel?3:1.5}"/>`+
      `<text x="${x}" y="${y+4}" font-size="11" text-anchor="middle" fill="#0a1724" font-weight="700">${r.last.total}</text>`+
      `<text x="${x}" y="${y+rad+16}" font-size="${r.n.top?17:12.5}" text-anchor="middle" fill="${hit?'#f6d696':'#e9eef4'}" font-weight="${hit||sel?700:500}">${esc(r.last.name)}</text>`+
      (closed?`<text x="${x+rad+4}" y="${y-rad+2}" font-size="11" text-anchor="middle" fill="#9fb1c4">＋${r.last.kids.size}</text>`:'')+`</g>`}
  return `<div class="svgwrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم شجرة السلالات">${s}</svg></div>`;
}

function cardHTML(root){
  let node=null;
  if(ui.sel){const parts=ui.sel.split('>');let n=root;for(const p of parts){n=n&&n.kids.get(p)}node=n||null}
  if(!node){return `<aside class="card"><h3>بطاقة الفرع</h3><p class="hint">اختر أي فرع من الشجرة لترى عدد المشاركين فيه، وتوزّعهم على المحافظات، ونوع فحوصاتهم، ومساره الكامل.</p>
    <div class="legend"><span><span class="tag deep">عميق</span>Big Y وما يماثله</span><span><span class="tag str">ماركرات</span>Y-37 حتى Y-111</span><span><span class="tag ff">تقديري</span>Family Finder</span></div></aside>`}
  const anc=ancestry(node),letter=anc[0].name;
  const regs=Object.entries(node.regions).sort((a,b)=>b[1]-a[1]),max=regs.length?regs[0][1]:1;
  const tests=Object.entries(node.tests).sort((a,b)=>b[1]-a[1]);
  return `<aside class="card" style="--c:${colorOf(letter)}">
    <h3 class="name" style="font-size:1.35rem">${esc(node.name)}</h3>
    <div class="crumbs">${anc.map(a=>`<button type="button" data-k="${esc(pathKey(a))}">${esc(a.name)}</button>`).join('')}</div>
    <div class="big"><div><b>${node.total}</b><span>مشاركًا في الفرع وما تحته</span></div><div><b>${node.direct}</b><span>آخر تحوّرهم هنا</span></div>${DATA.ages[node.name]?`<div><b class="age" style="font-size:1rem">${esc(DATA.ages[node.name])}</b><span>عمر الفرع</span></div>`:''}</div>
    <h3>المحافظات</h3><div class="mini">${regs.map(([r,c])=>`<div class="r"><span>${esc(r)}</span><span class="t"><i style="width:${c/max*100}%"></i></span><b>${c}</b></div>`).join('')}</div>
    <h3>نوع الفحص</h3><div style="margin:6px 0 12px">${tests.map(([d,c])=>`<span class="tag ${d}">${DEPTH_AR[d]} · ${c}</span>`).join(' ')}</div>
    ${node.names.length?`<h3>مشاركون بأسمائهم</h3><p class="names">${node.names.map(esc).join('، ')}</p>`:''}
    <p class="hint">لمشاركة هذا الفرع أضف إلى آخر رابط الصفحة: <span class="en">#n-${esc(slug(node.name))}</span></p>
  </aside>`;
}

function render(){
  const all=build(DATA.entries),root=build(filtered());
  const regions=new Set(DATA.entries.map(e=>e.region).filter(r=>r&&r!=='غير محدد'));
  const deep=DATA.entries.filter(e=>depthOf(e.test)==='deep').length;
  let hint='';
  if(ui.q){const hits=findAll(root,n=>matches(n,ui.q));hits.forEach(h=>ancestry(h).slice(0,-1).forEach(a=>open.add(pathKey(a))));hint=hits.length?`عدد الفروع المطابقة: ${hits.length}`:'لا يوجد فرع مطابق بعد';}
  const tops=sorted(all.kids),tot=DATA.entries.length||1,maxTop=tops.length?tops[0].total:1;
  const bars=tops.map(t=>`<button type="button" class="bar" data-k="${esc(t.name)}"><span class="l" style="color:${colorOf(t.name)}">${esc(t.name)}</span><span class="t"><i style="width:${t.total/maxTop*100}%;background:${colorOf(t.name)}"></i></span><span class="v">${t.total} · ${Math.round(t.total/tot*100)}%</span></button>`).join('');
  const body=!DATA.entries.length?`<div class="empty"><b>الشجرة بانتظار أول المشاركات</b>شارك سلالتك الأبوية مع صفحة «الجينوم السوري» في التعليقات أو على الخاص، وسيظهر فرعك هنا.</div>`:
    !root.kids.size?`<div class="empty"><b>لا مشاركات تطابق هذا الاختيار</b>غيّر المحافظة أو نوع الفحص.</div>`:
    ui.view==='list'?`<ul>${sorted(root.kids).map(rowHTML).join('')}</ul>`:svgHTML(root);
  app.innerHTML=`<div class="wrap">
  <header><h1>شجرة السلالات الأبوية السورية</h1><div class="en">Syrian paternal-lineage tree</div>
  <p class="lead">مشروع تشاركي من صفحة «الجينوم السوري» يجمع السلالات الأبوية التي يشاركنا بها المختبرون السوريون. اضغط على أي سلالة لتنفتح فروعها فرعًا فرعًا حتى آخر تحوّر، أو ابحث عن تحوّر بعينه.</p></header>
  <div class="stats">
    <div class="stat"><b>${DATA.entries.length}</b><span>مشاركة</span></div>
    <div class="stat"><b>${all.kids.size}</b><span>سلالة كبرى</span></div>
    <div class="stat"><b>${regions.size}</b><span>محافظة</span></div>
    <div class="stat"><b>${deep}</b><span>بفحص تحوّرات عميق</span></div>
  </div>
  ${tops.length?`<section class="dist"><h2>توزّع السلالات الكبرى بين المشاركين</h2><div class="bars">${bars}</div></section>`:''}
  <div class="controls">
    <input id="q" type="search" placeholder="FGC12 · L454 · M123" value="${esc(ui.q)}" aria-label="ابحث عن تحوّر">
    <select id="gov" aria-label="المحافظة"><option value="">كل المحافظات</option>${GOVS.map(g=>`<option${ui.gov===g?' selected':''}>${g}</option>`).join('')}</select>
    <select id="dep" aria-label="نوع الفحص"><option value="">كل الفحوصات</option>${['deep','str','ff','other'].map(d=>`<option value="${d}"${ui.depth===d?' selected':''}>${DEPTH_AR[d]}</option>`).join('')}</select>
    <span class="seg" role="group" aria-label="طريقة العرض"><button type="button" data-v="list" aria-pressed="${ui.view==='list'}">قائمة</button><button type="button" data-v="draw" aria-pressed="${ui.view==='draw'}">شجرة مرسومة</button></span>
    <button type="button" class="btn" id="all">فتح الكل</button><button type="button" class="btn" id="none">طيّ الكل</button>
  </div>
  <div class="hint" aria-live="polite">${hint}</div>
  <div class="main"><div class="tree" id="tree">${body}</div>${cardHTML(root)}</div>
  <p class="note">الأرقام تعكس من شاركونا نتائجهم، لا نسب السلالات بين السوريين جميعًا. ونتائج Family Finder وفحوصات الماركرات تُظهر سلالة تقديرية في مستوى أعلى من الشجرة، بينما يحدد Big Y الفرع بدقة. لا نعرض أسماء المشاركين إلا لمن وافق على ذلك صراحة.</p>
  ${isAdmin?adminHTML():''}
  <footer><span><a href="index.html">الجينوم السوري</a> <span class="en">· Syrian Genome</span></span><span><a href="https://www.facebook.com/SyrianGenome" target="_blank" rel="noopener">فيسبوك</a> · <a href="https://x.com/SyrianGenome" target="_blank" rel="noopener">X</a></span></footer>
  </div>`;
  wire();
}

function select(key){ui.sel=key;const parts=key.split('>');for(let i=1;i<parts.length;i++)open.add(parts.slice(0,i).join('>'));
  try{history.replaceState(null,'','#n-'+slug(parts[parts.length-1]))}catch(e){}render();}

function adminHTML(){
  const ed=editId?draft.entries.find(x=>x.id===editId):null;
  const rows=draft.entries.slice().reverse().map(e=>`<div class="row"><span class="p">${esc(e.path.join(' > '))}</span><span class="acts"><button type="button" class="mini-btn" data-edit="${esc(e.id)}">تعديل</button>${e.name?`<button type="button" class="mini-btn" data-hide="${esc(e.id)}">${e.hideName?'إظهار الاسم':'إخفاء الاسم'}</button>`:''}<button type="button" class="mini-btn del" data-del="${esc(e.id)}">حذف</button></span><span>${esc(e.region)} · ${esc(e.test)}${e.name?` · ${esc(e.name)}${e.hideName?' (مخفي)':''}`:''}</span></div>`).join('');
  return `<section class="admin" aria-label="لوحة المشرف"><h2>لوحة المشرف</h2>
  <p class="hint">تظهر لك وحدك. أضف المشاركات ثم اضغط «حفظ ونشر» مرة واحدة.</p>
  <div class="grid">
    <label style="grid-column:1/-1">المسار الأبوي، أو آخر تحوّر فقط إذا كان فرعه موجودًا في الشجرة<textarea id="fPath" placeholder="J-M267 > J-P58 > J-FGC12">${ed?esc(ed.path.join(' > ')):''}</textarea></label>
    <label>المحافظة<select id="fGov">${GOVS.map(g=>`<option${ed&&ed.region===g?' selected':''}>${g}</option>`).join('')}</select></label>
    <label>نوع الفحص<select id="fTest">${TESTS.map(t=>`<option${ed&&ed.test===t?' selected':''}>${esc(t)}</option>`).join('')}</select></label>
    <label>الاسم (اختياري)<input type="text" id="fName" placeholder="يُعرض فقط بموافقة صاحبه" value="${ed&&ed.name?esc(ed.name):''}"></label>
    <label class="check"><input type="checkbox" id="fOk"${ed&&ed.name?' checked':''}> وافق صاحبه كتابيًا على عرض اسمه</label>
  </div>
  <div class="controls" style="margin-top:12px">${ed?'<span class="pending">تعديل مشاركة: غيّر الحقول ثم اضغط «تحديث»</span><button type="button" class="btn" id="add">تحديث المشاركة</button><button type="button" class="btn" id="cancel">إلغاء</button>':'<button type="button" class="btn" id="add">إضافة إلى المسودة</button>'}
  <button type="button" class="btn solid" id="save" ${dirty?'':'disabled'}>حفظ ونشر</button><span class="pending">${dirty?'تعديلات غير محفوظة':''}</span></div>
  <div class="grid" style="margin-top:14px">
    <label>عمر فرع (اسم التحوّر)<input type="text" id="aNode" placeholder="J-FGC12" dir="ltr"></label>
    <label>العمر كما يظهر<input type="text" id="aText" placeholder="نحو 3,300 سنة"></label>
  </div>
  <div class="controls" style="margin-top:8px"><button type="button" class="btn" id="addAge">إضافة العمر إلى المسودة</button></div>
  <p class="hint" id="aMsg"></p>
  <div class="rows">${rows||'<p class="hint">لا مشاركات بعد.</p>'}</div></section>`;
}

function commit(){DATA=JSON.parse(JSON.stringify(draft));dirty=true;render();}
function wire(){
  const q=document.getElementById('q');
  q.addEventListener('input',()=>{ui.q=q.value.trim().toUpperCase();const pos=q.selectionStart;render();const n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}
    const f=document.querySelector('.node.hit');if(f)f.scrollIntoView({block:'nearest'});});
  document.getElementById('gov').onchange=e=>{ui.gov=e.target.value;render();};
  document.getElementById('dep').onchange=e=>{ui.depth=e.target.value;render();};
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ui.view=b.dataset.v;render();});
  const all=document.getElementById('all');if(all)all.onclick=()=>{findAll(build(filtered()),()=>true).forEach(n=>open.add(pathKey(n)));render();};
  const none=document.getElementById('none');if(none)none.onclick=()=>{open.clear();render();};
  document.querySelectorAll('.tog').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const k=b.dataset.t;open.has(k)?open.delete(k):open.add(k);render();});
  document.querySelectorAll('.node,[data-k]').forEach(el=>{if(el.classList.contains('tog'))return;
    el.addEventListener('click',()=>{const k=el.dataset.k;if(el.dataset.g||el.classList.contains('node')){if(open.has(k)&&ui.sel===k)open.delete(k);else open.add(k);}select(k);});
    if(el.classList.contains('node'))el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(el.dataset.k)}});});
  if(!isAdmin)return;
  const m=document.getElementById('aMsg');
  document.getElementById('add').onclick=()=>{
    let path=parsePath(document.getElementById('fPath').value);
    if(!path.length){m.textContent='اكتب المسار أولًا.';return;}
    /* auto-complete: if the first step is already on the tree, prepend its known ancestors */
    const known=findAll(build(draft.entries.filter(x=>x.id!==editId)),n=>n.name===path[0])[0];
    let filled=0;
    if(known){const pre=ancestry(known).slice(1,-1).map(n=>n.name);filled=pre.length;path=[...pre,...path];}
    else if(path.length===1){m.textContent='هذا التحوّر غير موجود في الشجرة بعد، فالصق مساره الكامل مرة واحدة، وبعدها يكفي اسمه.';return;}
    const nm=document.getElementById('fName').value.trim(),ok=document.getElementById('fOk').checked;
    if(nm&&!ok){m.textContent='لا يُضاف الاسم إلا بعد تأكيد موافقة صاحبه.';return;}
    const rec={path,region:document.getElementById('fGov').value,test:document.getElementById('fTest').value,name:nm||undefined};
    if(editId){const e=draft.entries.find(x=>x.id===editId);if(e){Object.assign(e,rec);e.updated=new Date().toISOString().slice(0,10);if(!nm)delete e.hideName;}editId=null;}
    else draft.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...rec,added:new Date().toISOString().slice(0,10)});
    commit();
    if(filled){const mm=document.getElementById('aMsg');if(mm)mm.textContent=`أُكمل المسار تلقائيًا من الشجرة، وعدد التحوّرات المضافة: ${filled}.`;}
  };
  document.getElementById('addAge').onclick=()=>{
    const n=parsePath(document.getElementById('aNode').value)[0],t=document.getElementById('aText').value.trim();
    if(!n||!t){m.textContent='اكتب اسم التحوّر والعمر.';return;}
    draft.ages[n]=t;commit();
  };
  const cancel=document.getElementById('cancel');if(cancel)cancel.onclick=()=>{editId=null;render();};
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render();const t=document.getElementById('fPath');if(t){t.scrollIntoView({block:'center'});t.focus();}});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{draft.entries=draft.entries.filter(e=>e.id!==b.dataset.del);commit();});
  document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{const e=draft.entries.find(x=>x.id===b.dataset.hide);if(e){e.hideName=!e.hideName;commit();}});
  document.getElementById('save').onclick=async()=>{
    const btn=document.getElementById('save');btn.disabled=true;btn.textContent='جارٍ النشر…';
    try{await art.publish(buildDoc(draft));}
    catch(e){const c=e&&e.code;btn.textContent='حفظ ونشر';btn.disabled=false;
      m.textContent=c==='conflict'?'نُشرت نسخة أحدث، وستُحدَّث الصفحة الآن.':(c==='not_writer'||c==='not_granted')?'هذه النسخة للقراءة فقط.':'تعذّر النشر الآن، حاول بعد قليل.';}
  };
}

function buildDoc(state){
  const head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  const links=[...document.querySelectorAll('link[href*="fonts.g"]')].map(l=>l.outerHTML).join('');
  const css=document.getElementById('st').textContent,js=document.getElementById('main').textContent;
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  return head+'<meta name="claude:viewport-fit-sides" content="cover">'+links+
    '<style id="st">'+css+'</style><div id="app" dir="rtl" lang="ar"></div><script type="application/json" id="data">'+json+'<\/script><script id="main">'+js+'<\/script></body></html>';
}

function fromHash(){const h=(location.hash||'').replace(/^#n-/,'');if(!h)return;
  const hit=findAll(build(DATA.entries),n=>slug(n.name)===h)[0];if(hit){ui.sel=pathKey(hit);ancestry(hit).slice(0,-1).forEach(a=>open.add(pathKey(a)));}}
fromHash();
window.addEventListener('hashchange',()=>{fromHash();render();});
render();
(async()=>{try{if(!window.claude||!claude.use)return;
  const [u,a]=await Promise.all([claude.use("user"),claude.use("artifact")]);
  if(!u||!a)return;if(await u.canEdit()){art=a;isAdmin=true;render();}}catch(e){}})();
})();
</script>

</body>
</html>
